<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="37" fill="#0a0e1a"/>
  <rect x="4" y="4" width="172" height="172" rx="33" fill="none" stroke="#00ffff" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Lightning bolt / Zap icon -->
  <path d="M105 30L55 100H85L70 150L125 75H95L105 30Z" fill="#00ffff"/>
  <!-- Subtle glow -->
  <path d="M105 30L55 100H85L70 150L125 75H95L105 30Z" fill="#00ffff" opacity="0.3" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
